<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Circle with Glow -->
  <circle cx="100" cy="100" r="90" stroke="url(#grad1)" stroke-width="3" fill="none" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Hexagon Background -->
  <path d="M 100 25 L 155 62.5 L 155 137.5 L 100 175 L 45 137.5 L 45 62.5 Z" 
        fill="url(#grad1)" opacity="0.1" stroke="url(#grad2)" stroke-width="2"/>
  
  <!-- Central Circuit Pattern -->
  <g filter="url(#glow)">
    <!-- Vertical Lines -->
    <line x1="100" y1="50" x2="100" y2="80" stroke="#0ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="120" x2="100" y2="150" stroke="#0ff" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Horizontal Lines -->
    <line x1="50" y1="100" x2="80" y2="100" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="100" x2="150" y2="100" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Diagonal Lines -->
    <line x1="70" y1="70" x2="85" y2="85" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="115" y1="115" x2="130" y2="130" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="130" y1="70" x2="115" y2="85" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="85" y1="115" x2="70" y2="130" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Central Node -->
    <circle cx="100" cy="100" r="15" fill="#0b0f1e" stroke="url(#grad2)" stroke-width="3"/>
    <circle cx="100" cy="100" r="8" fill="url(#grad1)"/>
    
    <!-- Corner Nodes -->
    <circle cx="100" cy="50" r="6" fill="#0ff" opacity="0.8"/>
    <circle cx="100" cy="150" r="6" fill="#0ff" opacity="0.8"/>
    <circle cx="50" cy="100" r="6" fill="#06b6d4" opacity="0.8"/>
    <circle cx="150" cy="100" r="6" fill="#06b6d4" opacity="0.8"/>
    <circle cx="70" cy="70" r="5" fill="#8b5cf6" opacity="0.8"/>
    <circle cx="130" cy="130" r="5" fill="#8b5cf6" opacity="0.8"/>
    <circle cx="130" cy="70" r="5" fill="#8b5cf6" opacity="0.8"/>
    <circle cx="70" cy="130" r="5" fill="#8b5cf6" opacity="0.8"/>
  </g>
  
  <!-- Orbit Rings -->
  <circle cx="100" cy="100" r="70" stroke="url(#grad2)" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="5,5"/>
  <circle cx="100" cy="100" r="55" stroke="url(#grad1)" stroke-width="1" fill="none" opacity="0.2" stroke-dasharray="3,3"/>
</svg>
